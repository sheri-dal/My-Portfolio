<header class="sticky top-0 z-50 w-full px-3 pt-3 sm:px-5 sm:pt-4" role="banner">
  <div
    class="glass-panel relative mx-auto flex h-14 max-w-6xl items-center gap-3 overflow-hidden rounded-2xl px-3 shadow-[var(--navbar-shadow)] sm:h-16 sm:gap-4 sm:px-4 sm:rounded-[1.35rem]"
  >
    <div class="pointer-events-none absolute inset-x-6 top-0 h-px bg-gradient-to-r from-transparent via-purple-400/50 to-transparent"></div>

    <a
      class="relative flex shrink-0 items-center gap-2 font-[Poppins,ui-sans-serif,sans-serif] text-sm font-semibold tracking-[0.18em] text-slate-900 transition-transform duration-200 hover:-translate-y-0.5 dark:text-slate-50"
      [routerLink]="['/']"
      fragment="home"
      aria-label="Go to home section"
    >
      <img
        ngSrc="assets/icons/logo.png"
        width="160"
        height="64"
        alt="Portfolio logo"
        priority
        class="h-10 w-auto max-h-10 object-contain drop-shadow-[0_0_12px_rgba(124,92,255,0.3)] transition duration-200 hover:drop-shadow-[0_0_18px_rgba(124,92,255,0.45)] sm:h-12 sm:max-h-12"
      />
    </a>

    <nav class="relative hidden flex-1 items-center justify-center gap-1 min-[831px]:flex" aria-label="Primary Navigation">
      <span
        class="pointer-events-none absolute top-1/2 h-9 -translate-y-1/2 rounded-full transition-all duration-300 ease-out"
        [style.left]="indicatorStyle().left"
        [style.width]="indicatorStyle().width"
        [style.opacity]="indicatorStyle().opacity"
        [style.background]="'var(--navbar-pill-bg)'"
        aria-hidden="true"
      ></span>

      @for (link of links; track link.fragment) {
        <a
          #navLink
          class="group relative z-10 px-3.5 py-2 text-[13px] font-medium tracking-wide text-[var(--navbar-link)] transition-colors duration-200 hover:text-slate-950 dark:hover:text-white"
          [routerLink]="['/']"
          [fragment]="link.fragment"
          [attr.aria-current]="currentFragment() === link.fragment ? 'page' : null"
          (click)="onNavigate(link.fragment, $event)"
        >
          <span [style.color]="currentFragment() === link.fragment ? 'var(--color-accent)' : null">{{ link.label | translate }}</span>
        </a>
      }
    </nav>

    <div class="relative hidden items-center gap-2 min-[831px]:flex" aria-label="Theme and CV Actions">
      <app-language-toggle></app-language-toggle>
      <app-theme-toggle></app-theme-toggle>
      <app-download-cv-button></app-download-cv-button>
    </div>

    <div class="relative ml-auto flex items-center gap-1 min-[831px]:hidden">
      <app-theme-toggle></app-theme-toggle>

      <button
        type="button"
        class="inline-flex h-9 w-9 items-center justify-center rounded-xl text-[var(--navbar-link)] transition-all duration-200 hover:-translate-y-0.5 hover:bg-[var(--navbar-link-hover)] hover:text-purple-600 focus:outline-none focus-visible:ring-2 focus-visible:ring-purple-500/60 dark:hover:text-purple-300 sm:h-10 sm:w-10"
        aria-label="Open navigation menu"
        [attr.aria-expanded]="mobileOpen()"
        (click)="openMobileMenu()"
      >
        <span nz-icon nzType="menu" nzTheme="outline" aria-hidden="true" class="text-[1rem] sm:text-[1.1rem]"></span>
      </button>
    </div>
  </div>
</header>
